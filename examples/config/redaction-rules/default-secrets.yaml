kind: RedactionRule
metadata: {name: default-secrets, owner: security@example.com}
spec:
  patterns:
    - '(?i)\bbearer\s+[a-z0-9._~+/-]{16,}=*'
    - '(?i)\b(password|passwd|secret|api[_-]?key)\s*[:=]\s*[^\s,;]{8,}'
    - '\bAKIA[0-9A-Z]{16}\b'
    - '-----BEGIN [A-Z ]*PRIVATE KEY-----'
    - '(?i)\b[a-z]+://[^\s:/@]+:[^\s@/]+@'
