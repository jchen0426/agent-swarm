kind: RedactionRule
metadata: {name: default-secrets, owner: security@example.com}
spec:
  always: true
  patterns:
    - '(?i)\bbearer\s+[a-z0-9._~+/-]{16,}=*'
    - '(?i)\b(password|passwd|secret|api[_-]?key)\s*[:=]\s*[^\s,;]{8,}'
    - '\bAKIA[0-9A-Z]{16}\b'
    - '-----BEGIN [A-Z ]*PRIVATE KEY-----(?:[\s\S]*?-----END [A-Z ]*PRIVATE KEY-----|[A-Za-z0-9+/=:,\s\\-]*)'
    - '(?i)\b[a-z]+://[^\s:/@]+:[^\s@/]+@'
