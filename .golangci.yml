version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly
  go: "1.26"
  # Integration, end-to-end, live and image tests sit behind build tags.
  # Without the tags the linters never parse them, and they rot silently.
  build-tags:
    - integration
    - e2e
    - live
    - image

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - gocritic
    - gocyclo
    - dupl
    - misspell
    - unconvert
    - gosec
    - revive
    - unused
    - usestdlibvars
    - whitespace
    - testifylint
    - depguard
    - errorlint
    - predeclared
    - perfsprint
    - nilnesserr
    - godot
    - forbidigo
    - fatcontext
    - sloglint

  exclusions:
    paths:
      - ".*\\.pb\\.go$"
      - ".*_mock\\.go$"
    rules:
      # Test files are not checked for complexity, duplication or unchecked errors.
      - linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - perfsprint
        path: _test.go
      # Scripts may print; the rule of html/template's typed strings still
      # holds there, as everywhere (R154).
      - linters:
          - forbidigo
        path: ^scripts/
        text: "fmt\\.Print"

  settings:
    sloglint:
      # When a context.Context is in scope, log calls must use the *Context
      # variants, so that request-scoped values reach the log handler.
      context: scope
    gocyclo:
      min-complexity: 15

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style

    depguard:
      rules:
        main:
          deny:
            - pkg: "io/ioutil"
              desc: "Use 'os' or 'io' functions instead"
            - pkg: "github.com/pkg/errors"
              desc: "Use 'errors' or 'fmt' instead"
            - pkg: "github.com/golang/mock"
              desc: "Use 'go.uber.org/mock' instead (golang/mock is deprecated)"
            - pkg: "github.com/golang/mock/gomock"
              desc: "Use 'go.uber.org/mock/gomock' instead"
            - pkg: "github.com/golang/mock/mockgen"
              desc: "Use 'go.uber.org/mock/mockgen' instead"
        # End-to-end tests are black-box: they drive the built binary over its
        # public interfaces and never import platform internals. depguard
        # matches absolute file paths, so each glob starts with `**/`. Two
        # globs are needed because `**` matches one or more path segments, so
        # `**/test/e2e/**/*.go` alone misses the top-level files.
        e2e:
          # Strict: only what allow lists, and an allow entry longer than a
          # deny entry it falls under wins, so that webtest alone is allowed
          # under internal.
          list-mode: strict
          files:
            - "**/test/e2e/*.go"
            - "**/test/e2e/**/*.go"
          allow:
            - $gostd
            - github.com/stretchr/testify
            - github.com/testcontainers/testcontainers-go
            # The harness the tests share. Of the platform's packages, its
            # non-test files import webtest alone (below); its Chrome self-test
            # reads the constant web.BoardPolicy.
            - github.com/jchen0426/agent-swarm/test/e2e/harness
            # The web interface's test fakes, a fake IdP and a browser (Plan
            # 9a-1, m18): not the system under test, which the harness drives
            # through the binary alone. No other internal package is allowed.
            - github.com/jchen0426/agent-swarm/internal/web/webtest
            # The engine's API types that testcontainers' host-config
            # modifier takes, by which the harness publishes the browser
            # gate's database on loopback alone (Plan 9a-2, R163); types
            # alone, not the engine's client.
            - github.com/moby/moby/api/types/container
            - github.com/moby/moby/api/types/network
            # The HTML parser by which the harness reads each board poll's
            # body (Plan 9a-3, R184); the parser alone, not golang.org/x/net,
            # as depguard allows by prefix and x/net holds network packages.
            - golang.org/x/net/html
          deny:
            - pkg: "github.com/jchen0426/agent-swarm/internal"
              desc: "e2e is black-box; drive the binary, not internal types"
            - pkg: "github.com/jackc/pgx"
              desc: "no direct database access from e2e"
            - pkg: "database/sql"
              desc: "no direct database access from e2e"

    forbidigo:
      # Match by type, so that a renamed import of a package is caught as its
      # own name.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: "use log/slog structured logging instead of fmt.Print"
        # html/template's typed strings skip its escaping: every stored value
        # reaches a page as a plain string, through inertText or inertLine,
        # which html/template escapes (Plan 9a-2, R154).
        - pattern: ^template\.(CSS|HTML|HTMLAttr|JS|JSStr|Srcset|URL)$
          msg: "html/template's typed strings skip its escaping: pass a plain string, through inertText or inertLine (R154)"

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    revive:
      rules:
        - name: error-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: context-as-argument
        - name: var-naming
        - name: increment-decrement
        - name: var-declaration
        - name: indent-error-flow
        - name: superfluous-else

    gosec:
      excludes:
        - G118

    staticcheck:
      checks:
        - all

formatters:
  enable:
    - gci
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - blank
        - default
        - localmodule

issues:
  max-same-issues: 0
  max-issues-per-linter: 0

output:
  formats:
    text:
      print-linter-name: true
  sort-results: true
  sort-order:
    - linter
    - severity
